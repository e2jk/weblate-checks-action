version: 2
updates:
  # Keep GitHub Actions SHA-pinned versions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  # Keep dev/test dependencies current
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
